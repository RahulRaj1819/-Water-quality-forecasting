services:
  - type: web
    name: water-quality-prediction
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install --only-binary=:all: grpcio grpcio-tools && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        value: AIzaSyBmppH6aFbeu18WUPXeGaMVVVFtYnIU584
